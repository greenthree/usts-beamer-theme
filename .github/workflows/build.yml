name: Build template

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-lang-chinese texlive-latex-extra poppler-utils

      - name: Compile template and syntax examples
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error template.tex example.tex

      - name: Check layout regressions
        run: python3 tests/check_layout.py

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          name: usts-beamer-template
          path: |
            template.pdf
            example.pdf
            build/layout/*/*.pdf
